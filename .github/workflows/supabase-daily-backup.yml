name: supabase-daily-backup

on:
  schedule:
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          pip3 install --break-system-packages google-auth google-api-python-client

      - name: Verify PostgreSQL version
        run: pg_dump --version

      - name: Create backup directory
        run: mkdir -p backups

      - name: Generate backup filename
        id: backup-file
        run: |
          BACKUP_FILE="supabase-backup-$(date +%Y%m%d-%H%M%S).sql"
          echo "filename=$BACKUP_FILE" >> $GITHUB_OUTPUT

      - name: Create database backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Creating database backup..."
          
          DB_USER=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*://\([^:]*\):.*|\1|p')
          DB_PASS=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
          DB_HOST=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*@\([^:]*\):.*|\1|p')
          DB_PORT=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*:\([0-9]*\)/.*|\1|p')
          DB_NAME=$(echo "$SUPABASE_DB_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
          
          export PGPASSWORD="$DB_PASS"
          
          pg_dump \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --schema=public \
            --data-only \
            --inserts \
            --no-owner \
            --no-acl \
            --verbose \
            > backups/${{ steps.backup-file.outputs.filename }}
          
          unset PGPASSWORD
          BACKUP_SIZE=$(du -h backups/${{ steps.backup-file.outputs.filename }} | cut -f1)
          echo "✓ Backup created successfully"
          echo "  File: ${{ steps.backup-file.outputs.filename }}"
          echo "  Size: $BACKUP_SIZE"

      - name: Compress backup
        run: |
          echo "Compressing backup..."
          gzip backups/${{ steps.backup-file.outputs.filename }}
          echo "✓ Backup compressed successfully"

      - name: Create Google Drive upload script
        run: |
          cat > upload_to_drive.py << 'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request

          def main():
              creds = Credentials(
                  token=None, 
                  refresh_token=os.environ['GOOGLE_REFRESH_TOKEN'],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ['GOOGLE_CLIENT_ID'],
                  client_secret=os.environ['GOOGLE_CLIENT_SECRET']
              )

              creds.refresh(Request())
              service = build('drive', 'v3', credentials=creds)
              
              folder_id = os.environ.get('GOOGLE_DRIVE_FOLDER_ID')
              filename = os.environ['BACKUP_FILENAME']
              filepath = f'backups/{filename}.gz'

              # DEBUG: Check if folder exists
              try:
                  service.files().get(fileId=folder_id).execute()
                  print(f"✓ Target folder {folder_id} found and accessible.")
              except Exception as e:
                  print(f"X Error: Cannot access folder {folder_id}. Detail: {e}")
                  # If the folder isn't found, we'll try uploading to root as a fallback
                  folder_id = None 

              file_metadata = {
                  'name': f'{filename}.gz',
                  'parents': [folder_id] if folder_id else []
              }

              if not os.path.exists(filepath):
                  print(f"X Error: Local file {filepath} not found!")
                  return

              media = MediaFileUpload(filepath, mimetype='application/gzip', resumable=True)
              
              file = service.files().create(
                  body=file_metadata,
                  media_body=media,
                  fields='id, name'
              ).execute()

              print(f"✓ Success! Uploaded: {file.get('name')} (ID: {file.get('id')})")

          if __name__ == '__main__':
              main()
          EOF

      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          BACKUP_FILENAME: ${{ steps.backup-file.outputs.filename }}
        run: |
          python3 upload_to_drive.py

      - name: Clean up local backup
        if: always()
        run: |
          rm -rf backups/